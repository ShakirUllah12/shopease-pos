<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShopEase POS" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- App description & tags -->
    <meta name="description" content="ShopEase POS — Retail Billing, Barcode Scanning, Digital Payments & Customer Khata Ledger" />
    <title>ShopEase POS — Retail Billing & Shop Management</title>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((reg) => console.log('✅ ShopEase POS PWA Service Worker Registered', reg.scope))
            .catch((err) => console.debug('Service Worker registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
