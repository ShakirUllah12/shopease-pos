<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Shopping Cart Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 76) scale(0.75)">
    <!-- Wheels -->
    <circle cx="160" cy="420" r="32" fill="#ffffff" />
    <circle cx="380" cy="420" r="32" fill="#ffffff" />
    <!-- Cart Body -->
    <path d="M40 40h60l48 240h260l40-160H130" stroke="#ffffff" stroke-width="28" />
    
    <!-- Barcode Stripes Inside Basket -->
    <line x1="200" y1="160" x2="200" y2="240" stroke="#ffffff" stroke-width="12" />
    <line x1="230" y1="160" x2="230" y2="240" stroke="#ffffff" stroke-width="8" />
    <line x1="260" y1="160" x2="260" y2="240" stroke="#ffffff" stroke-width="20" />
    <line x1="300" y1="160" x2="300" y2="240" stroke="#ffffff" stroke-width="10" />
    <line x1="330" y1="160" x2="330" y2="240" stroke="#ffffff" stroke-width="16" />
    <line x1="370" y1="160" x2="370" y2="240" stroke="#ffffff" stroke-width="12" />
  </g>
</svg>
